name: Android Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*'
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing tag to rebuild as a candidate (optional)'
        type: string
        required: false

jobs:
  build:
    name: Test and Build Unsigned APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stable_tag: ${{ steps.package.outputs.stable_tag }}
      notes_path: ${{ steps.package.outputs.notes_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || '' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install native runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config ninja-build python3 python3-venv curl pax bison flex zlib1g-dev

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Install pinned native build tools
        run: |
          python3 -m venv .native-runtime-venv
          .native-runtime-venv/bin/python -m pip install --upgrade pip
          .native-runtime-venv/bin/python -m pip install meson==1.7.2

      - name: Cache native runtime compiler outputs
        uses: actions/cache@v4
        with:
          path: build/native-runtime-cache
          key: ${{ runner.os }}-native-runtime-${{ hashFiles('tools/build_native_runtime.py', 'tools/native_*.py') }}-ndk-28.2.13676358-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-native-runtime-${{ hashFiles('tools/build_native_runtime.py', 'tools/native_*.py') }}-ndk-28.2.13676358-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and build unsigned release APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_TOOL_OPTIONS: '-Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2'
        run: |
          export PATH="$PWD/.native-runtime-venv/bin:$PATH"
          NATIVE_RUNTIME_GITHUB_TOKEN="$GITHUB_TOKEN"
          unset GITHUB_TOKEN
          ./gradlew \
            --max-workers=1 -Pkotlin.daemon.jvmargs=-Xmx4g \
            :r2pipe-kotlin:test \
            :terminal-emulator:testDebugUnitTest \
            :app:testFullDebugUnitTest \
            :app:testProotOnlyDebugUnitTest \
            :app:assembleFullRelease \
            :app:assembleProotOnlyRelease \
            -PnativeRuntimePython="$PWD/.native-runtime-venv/bin/python" \
            -PnativeRuntimeGithubToken="$NATIVE_RUNTIME_GITHUB_TOKEN"

      - name: Check packaged versions and stage unsigned artifacts
        id: package
        env:
          EXPECTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.source_tag }}
        run: |
          full=app/build/outputs/apk/full/release
          proot=app/build/outputs/apk/prootOnly/release
          version=$(jq -er '.elements[0].versionName' "$full/output-metadata.json")
          code=$(jq -er '.elements[0].versionCode' "$full/output-metadata.json")
          jq -e --arg v "$version" --argjson c "$code" \
            '.elements | length == 1 and .[0].versionName == $v and .[0].versionCode == $c' "$proot/output-metadata.json"
          tag="v$version"
          if [[ -n $EXPECTED_TAG && ${EXPECTED_TAG%%-rc*} != "$tag" ]]; then
            echo "::error::Tag $EXPECTED_TAG does not match packaged version $version"
            exit 1
          fi
          echo "stable_tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ -s .github/release-notes/$tag.md ]]; then
            echo "notes_path=.github/release-notes/$tag.md" >> "$GITHUB_OUTPUT"
          fi
          full_apk="$full/app-full-release-unsigned.apk"
          [[ -f "$full_apk" ]] || full_apk="$full/app-full-release.apk"
          proot_apk="$proot/app-prootOnly-release-unsigned.apk"
          [[ -f "$proot_apk" ]] || proot_apk="$proot/app-prootOnly-release.apk"
          dist=build/unsigned-artifacts
          runtime=app/build/generated/nativeRuntime
          mkdir -p "$dist"
          cp "$full_apk" "$dist/R2Droid-$tag-unsigned.apk"
          cp "$proot_apk" "$dist/R2Droid-Proot-$tag-unsigned.apk"
          cp "$runtime/source-lock.json" "$dist/native-runtime-source-lock-$tag.json"
          cp "$runtime/fullRelease/runtime-manifest.json" "$dist/native-runtime-manifest-full-$tag.json"
          cp "$runtime/prootOnlyRelease/runtime-manifest.json" "$dist/native-runtime-manifest-proot-$tag.json"

      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r2droid-unsigned-${{ github.run_id }}
          path: build/unsigned-artifacts/
          retention-days: 1
          if-no-files-found: error

  sign-and-release:
    name: Sign APKs and Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || '' }}

      - name: Set up Android Build Tools
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0

      - name: Download unsigned artifacts
        uses: actions/download-artifact@v4
        with:
          name: r2droid-unsigned-${{ github.run_id }}
          path: build/unsigned-artifacts

      - name: Sign release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STABLE_TAG: ${{ needs.build.outputs.stable_tag }}
        run: |
          set -euo pipefail
          apksigner="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0/apksigner"
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          chmod 600 "$keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"

          dist=build/release-artifacts
          mkdir -p "$dist"
          cp build/unsigned-artifacts/*.json "$dist/"

          for pair in \
            "R2Droid-${STABLE_TAG}-unsigned.apk:R2Droid-${STABLE_TAG}.apk" \
            "R2Droid-Proot-${STABLE_TAG}-unsigned.apk:R2Droid-Proot-${STABLE_TAG}.apk"; do
            src="build/unsigned-artifacts/${pair%%:*}"
            dst="$dist/${pair##*:}"
            "$apksigner" sign \
              --ks "$keystore" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$dst" \
              "$src"
            "$apksigner" verify --verbose "$dst"
          done

      - name: Upload candidate for review (no GitHub Release)
        if: github.event_name != 'push' || github.ref_name != needs.build.outputs.stable_tag
        uses: actions/upload-artifact@v4
        with:
          name: r2droid-candidate-${{ github.run_id }}
          path: build/release-artifacts/
          if-no-files-found: error

      - name: Build Changelog
        id: build_changelog
        if: github.event_name == 'push' && github.ref_name == needs.build.outputs.stable_tag && needs.build.outputs.notes_path == ''
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configuration: ".github/release-changelog-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref_name == needs.build.outputs.stable_tag
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
          body_path: ${{ needs.build.outputs.notes_path }}
          fail_on_unmatched_files: true
          files: build/release-artifacts/*
          draft: false
          prerelease: false
